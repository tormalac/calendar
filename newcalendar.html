<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Munkaidő naptár generálás</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 30px;
    }
    button {
      margin: 8px 5px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Munkaidő naptár generálás</h1>

<form id="naptarForm">
  <label>Év:</label>
  <input type="number" id="ev" value="2026" min="2020" max="2100"><br><br>

  <label>Te kezdő műszak (1–4):</label>
  <select id="muszak1Kezd">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select><br>

  <label>Asszony kezdő műszak (2–4):</label>
  <select id="muszak2Kezd">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select><br><br>

  <label>Ünnepnapok:</label><br>
  <input type="text" id="unnep" placeholder="01.01;12.25" size="40"><br>

  <label>Pihenőnapok:</label><br>
  <input type="text" id="piheno" placeholder="03.16;08.19" size="40"><br>

  <label>Ledolgozós napok:</label><br>
  <input type="text" id="ledolgozas" placeholder="01.10;08.21" size="40"><br><br>

  <button type="button" onclick="generalNaptar()">📄 Generálás és CSV letöltés</button>
  <button type="button" onclick="uploadToDrive()">☁️ Feltöltés Google Drive-ra</button>
</form>

<p id="driveStatus" style="color: gray;">🔄 Google Drive kapcsolat inicializálása...</p>

<!-- Google API -->
<script async defer src="https://apis.google.com/js/api.js?onload=onGapiLoad"></script>

<script>
const CLIENT_ID = "138092907737-892ojmsu4u2s829p0er3nh741i6haem2.apps.googleusercontent.com"; // <-- saját Client ID
const SCOPES = "https://www.googleapis.com/auth/drive.file";
let gapiLoaded = false;
let lastCsv = "";

// 🔹 Google API inicializálás
function onGapiLoad() {
  console.log("🔹 Google API script betöltődött, inicializálás...");
  gapi.load('client:auth2', async () => {
    try {
      await gapi.client.init({
        clientId: CLIENT_ID,
        scope: SCOPES
      });
      gapiLoaded = true;
      console.log("✅ Google API inicializálva");
      document.getElementById("driveStatus").textContent = "✅ Google Drive kapcsolat aktív";
      document.getElementById("driveStatus").style.color = "green";
    } catch (err) {
      console.error("❌ Google API inicializálási hiba:", err);
      document.getElementById("driveStatus").textContent = "❌ Google API inicializálása nem sikerült";
      document.getElementById("driveStatus").style.color = "red";
    }
  });
}

// 🔹 CSV generálás és letöltés
function generalNaptar() {
  const ev = parseInt(document.getElementById("ev").value);
  const muszak1Kezd = parseInt(document.getElementById("muszak1Kezd").value);
  const muszak2Kezd = parseInt(document.getElementById("muszak2Kezd").value);

  const muszak1Ciklus = [1, 2, 4, 3];
  const muszak2Ciklus = [2, 4, 3];

  const unnepInput = document.getElementById("unnep").value.split(";").map(s => s.trim()).filter(s => s);
  const pihenoInput = document.getElementById("piheno").value.split(";").map(s => s.trim()).filter(s => s);
  const ledolgozasInput = document.getElementById("ledolgozas").value.split(";").map(s => s.trim()).filter(s => s);

  let muszak1Index = muszak1Ciklus.indexOf(muszak1Kezd);
  let muszak2Index = muszak2Ciklus.indexOf(muszak2Kezd);
  if (muszak1Index === -1) muszak1Index = 0;
  if (muszak2Index === -1) muszak2Index = 0;

  let csv = "honap;nap;napIndex;muszak1;muszak2;unnep;piheno;ledolgozas;szabadsag;tappenz;komment\n";

  for (let honap = 1; honap <= 12; honap++) {
    const napok = new Date(ev, honap, 0).getDate();
    for (let nap = 1; nap <= napok; nap++) {
      const datum = new Date(ev, honap - 1, nap);
      let napIndex = datum.getDay();
      if (napIndex === 0) napIndex = 7;

      if (napIndex === 1 && (honap !== 1 || nap !== 1)) {
        muszak1Index = (muszak1Index + 1) % muszak1Ciklus.length;
        muszak2Index = (muszak2Index + 1) % muszak2Ciklus.length;
      }

      const key = ("0" + honap).slice(-2) + "." + ("0" + nap).slice(-2);
      csv += [
        honap, nap, napIndex,
        muszak1Ciklus[muszak1Index],
        muszak2Ciklus[muszak2Index],
        unnepInput.includes(key),
        pihenoInput.includes(key),
        ledolgozasInput.includes(key),
        false, false, ""
      ].join(";") + "\n";
    }
  }

  lastCsv = csv;

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${ev}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  alert("✅ CSV sikeresen generálva és letöltve!");
}

// 🔹 Feltöltés Google Drive-ra
async function uploadToDrive() {
  if (!lastCsv) {
    alert("Először generáld le a CSV-t!");
    return;
  }

  if (!gapiLoaded) {
    alert("A Google Drive kapcsolat még nem készült el. Próbáld újra pár másodperc múlva!");
    return;
  }

  try {
    const auth = gapi.auth2.getAuthInstance();
    if (!auth.isSignedIn.get()) {
      await auth.signIn();
    }

    const ev = document.getElementById("ev").value;
    const blob = new Blob([lastCsv], { type: "text/csv" });
    const metadata = {
      name: `${ev}.csv`,
      mimeType: "text/csv"
    };

    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", blob);

    const token = gapi.client.getToken().access_token;
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: new Headers({ Authorization: "Bearer " + token }),
      body: form
    });

    const data = await res.json();
    alert("✅ Feltöltve a Google Drive-ra!\nFájl ID: " + data.id);
  } catch (err) {
    console.error(err);
    alert("❌ Hiba történt a feltöltés közben.");
  }
}
</script>
</body>
</html>
