<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Naptár CSV alapján</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    margin: 20px;
  }

  #calendar {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
    justify-content: flex-start;
  }

  .month {
    flex: 0 0 320px; /* fix szélesség */
    max-width: 560px;
    border: 1px solid #ccc;
    padding: 10px;
    box-sizing: border-box;
  }

  .month table {
    width: 100%;
    border-collapse: collapse;
  }

  .month th, .month td {
    border: 1px solid #333;
    padding: 5px;
    text-align: center;
    width: 14.28%;
  }

  .unnep { background-color: #f88; }
  .piheno { background-color: #ffeb99; }
  .ledolgozas { background-color: #99ccff; }
  .szabadsag { background-color: #99ff99; }
  .tappenz { background-color: #cc99ff; }

  button {
    margin: 10px 0;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 16px;
  }

  /* rejtett file input */
  #csvFile {
    display: none;
  }

  input.muszak {
    width: 55px;
    text-align: center;
    font-size: 14px;
    padding: 1px;
    box-sizing: border-box;
  }

  td.selected {
    background-color: #b3e6b3 !important;
    border: 1px solid #339933;
  }
</style>
</head>
<body>

<h1>Naptár beolvasása</h1>

<div id="fileUploadContainer">
  <button id="selectFileBtn">📂 CSV megnyitása</button>
  <input type="file" id="csvFile" accept=".csv" />
</div>

<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const fileInput = document.getElementById('csvFile');
const selectBtn = document.getElementById('selectFileBtn');
let data = [];

selectBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    delimiter: ';',
    skipEmptyLines: true,
    complete: function(results) {
      data = results.data;
      renderCalendar();
    }
  });
});

const honapNevek = ['', 'Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const muszakNevek = { '1':'DE', '2':'DE', '3':'DU', '4':'ÉJ' };

function renderCalendar() {
  const months = [...new Set(data.map(d => d.honap))];
  let html = '';

  months.forEach(month => {
    html += '<div class="month">';
    html += `<h2>${honapNevek[parseInt(month)]}</h2>`;
    html += '<table>';
    html += '<tr><th>H</th><th>K</th><th>Sze</th><th>Cs</th><th>P</th><th>Szo</th><th>V</th></tr>';

    const monthData = data.filter(d => d.honap == month);
    let currentWeek = [];

    for (let i = 0; i < monthData.length; i++) {
      const day = monthData[i];
      const classes = [];
      if (day.unnep === 'true') classes.push('unnep');
      if (day.piheno === 'true') classes.push('piheno');
      if (day.ledolgozas === 'true') classes.push('ledolgozas');
      if (day.szabadsag === 'true') classes.push('szabadsag');
      if (day.tappenz === 'true') classes.push('tappenz');

      if (day.nap == 1) {
        for (let j = 1; j < day.napIndex; j++) {
          currentWeek.push('<td></td>');
        }
      }

      currentWeek.push(`
        <td class="${classes.join(' ')}">
          ${day.nap}<br>
          <input class="muszak" type="text"
            value="${muszakNevek[day.muszak1] || day.muszak1}/${muszakNevek[day.muszak2] || day.muszak2}" 
            data-index="${data.indexOf(day)}"
            data-field1="muszak1"
            data-field2="muszak2">
        </td>
      `);

      if (day.napIndex == 7 || i === monthData.length - 1) {
        html += '<tr>' + currentWeek.join('') + '</tr>';
        currentWeek = [];
      }
    }

    html += '</table></div>';
  });

  document.getElementById('calendar').innerHTML = html;

  // Fókusz / blur események
  document.querySelectorAll('.muszak').forEach(input => {
    input.addEventListener('focus', (e) => {
      const idx = parseInt(e.target.dataset.index);
      e.target.value = data[idx].muszak1 + '/' + data[idx].muszak2;
    });

    input.addEventListener('blur', (e) => {
      const idx = parseInt(e.target.dataset.index);
      let [m1, m2] = e.target.value.split('/').map(x => parseInt(x.trim()));
      if (![1,2,3,4].includes(m1)) m1 = data[idx].muszak1;
      if (![1,2,3,4].includes(m2)) m2 = data[idx].muszak2;
      data[idx].muszak1 = m1;
      data[idx].muszak2 = m2;
      e.target.value = (muszakNevek[m1] || m1) + '/' + (muszakNevek[m2] || m2);
    });
  });

  // 🟩 Kattintásra kijelölés
  document.querySelectorAll('.month td').forEach(cell => {
    cell.addEventListener('click', (e) => {
      document.querySelectorAll('.month td').forEach(c => c.classList.remove('selected'));
      e.currentTarget.classList.add('selected');
    });
  });

  // Mentés gomb csak egyszer
  if (!document.getElementById('saveCsvBtn')) {
    const saveBtn = document.createElement('button');
    saveBtn.id = 'saveCsvBtn';
    saveBtn.innerHTML = '⬇️ Mentés CSV-be';
    saveBtn.addEventListener('click', exportTableToCSV);
    document.body.insertBefore(saveBtn, document.getElementById('calendar'));
  }
}

function exportTableToCSV() {
  const header = "honap;nap;napIndex;muszak1;muszak2;unnep;piheno;ledolgozas;szabadsag;tappenz;komment\n";
  let csv = header;
  data.forEach(d => {
    const row = [
      d.honap, d.nap, d.napIndex, d.muszak1, d.muszak2,
      d.unnep, d.piheno, d.ledolgozas, d.szabadsag, d.tappenz, d.komment || '""'
    ];
    csv += row.join(";") + "\n";
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'szerkesztett_naptar.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
