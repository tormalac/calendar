<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Naptár CSV alapján</title>
<style>
body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: #f5f7fa;
  margin:20px;
  position: relative;
  min-height: 100vh;
  padding-bottom: 60px;
}
#calendar {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin-top:20px;
  justify-content:flex-start;
  min-height:200px;
}
#calendarPlaceholder {
  color:#aaa;
  text-align:center;
  width:100%;
  padding:80px 0;
  font-size:18px;
  font-style:italic;
  border: 2px dashed #ccc;
  border-radius:5px;
  background-color:#fff;
}
.month {
  flex:0 0 320px;
  max-width:560px;
  border:1px solid #ccc;
  border-radius:5px;
  padding:10px;
  box-sizing:border-box;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}
.month table { width:100%; border-collapse:collapse; }
.month th, .month td {
  border:1px solid #333;
  padding:5px;
  text-align:center;
  width:14.28%;
  position:relative;
  cursor:pointer;
}
.ledolgozott { background-color:#d3d3d3 !important; }
.szabadsag { background-color:#ffff99 !important; }
.tappenz { background-color:#cc99ff; }
.ledolgozas { background-color:#99ccff; }
.piheno { background-color:#ffeb99; }
.unnep { background-color:#f88; }
button {
  margin:10px 5px 10px 0;
  padding:8px 12px;
  cursor:pointer;
  font-size:16px;
}
#csvFile { display:none; }
input.muszak {
  width:55px;
  text-align:center;
  font-size:14px;
  padding:1px;
  box-sizing:border-box;
}
.comment-icon {
  position:absolute;
  top:0px;
  right:0px;
  font-size:8px;
  z-index:10;
  display:block;
}
#dayEditPopup {
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:15px;
  border:2px solid #333;
  border-radius:5px;
  z-index:1000;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
  max-width:300px;
}
#dayEditPopup label { display:block; margin:5px 0; }
#popupOverlay {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.3);
  z-index:900;
}
/* --- Jelmagyarázat --- */
#legend {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px 24px;
  margin-top:20px;
  margin-bottom:10px;
  font-size:15px;
  border-top:1px solid #ccc;
  padding-top:10px;
}
.legend-item { display:flex; align-items:center; gap:6px; }
.color-box {
  width:20px; height:20px; border:1px solid #555;
  display:inline-block; vertical-align:middle;
}
.color-box.unnep { background-color:#f88; }
.color-box.piheno { background-color:#ffeb99; }
.color-box.ledolgozas { background-color:#99ccff; }
.color-box.szabadsag { background-color:#ffff99; }
.color-box.tappenz { background-color:#cc99ff; }
/* --- Évjelölés --- */
#yearLabel {
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  font-weight:bold;
  opacity:0.6;
  font-size:16px;
}
.month td:not(:empty):hover {
  background-color: #e0f0ff;
  transition: background-color 0.2s ease;
}
</style>
</head>
<body>

<h1>Naptár szerkesztő</h1>

<div id="fileUploadContainer" style="display:flex; align-items:center; gap:10px;">
  <button id="selectFileBtn">📂 Megnyitás (.csv)</button>
  <input type="file" id="csvFile" accept=".csv" />
  <button id="saveCsvBtn" style="display:none;">💾 Mentés (.csv)</button>
</div>

<div id="calendar">
  <div id="calendarPlaceholder">Naptár betöltése...</div>
</div>

<!-- Jelmagyarázat helye -->
<div id="legend"></div>
<div id="yearLabel"></div>

<!-- Popup -->
<div id="popupOverlay"></div>
<div id="dayEditPopup">
  <h3 id="popupTitle"></h3>
  <label>Műszakom: <input type="number" id="editMuszak1" min="1" max="4"></label>
  <label>Párom műszakja: <input type="number" id="editMuszak2" min="1" max="4"></label>
  <label><input type="checkbox" id="editSzabadsag"> Szabadság</label>
  <label><input type="checkbox" id="editTappenz"> Táppénz</label>
  <label><input type="checkbox" id="editPiheno"> Pihenőnap</label>
  <label><input type="checkbox" id="editLedolgozas"> Ledolgozás</label>
  <label><input type="checkbox" id="editLedolgozott"> Ledolgoztam</label>
  <label>Ledolgozott órák: <input type="number" id="editLedolgozottOra" min="0" max="24" value="8"></label>
  <label>Túlóra órák: <input type="number" id="editTulora" min="0" max="24" value="0"></label>
  <label><textarea id="editComment" rows="3" style="width:100%"></textarea> Komment</label>
  <button id="saveDayEditBtn">Mentés</button>
  <button id="closeDayEditBtn">Mégse</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const fileInput = document.getElementById('csvFile');
const selectBtn = document.getElementById('selectFileBtn');
let data = [];

selectBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    delimiter: ';',
    skipEmptyLines: true,
    complete: function(results) {
      data = results.data.map(d => ({
        honap: parseInt(d.honap),
        nap: parseInt(d.nap),
        napIndex: parseInt(d.napIndex),
        muszak1: parseInt(d.muszak1),
        muszak2: parseInt(d.muszak2),
        unnep: d.unnep === 'true',
        piheno: d.piheno === 'true',
        ledolgozas: d.ledolgozas === 'true',
        szabadsag: d.szabadsag === 'true',
        tappenz: d.tappenz === 'true',
        ledolgozott: d.ledolgozott === 'true',
        ledolgozottOra: d.ledolgozottOra ? parseInt(d.ledolgozottOra) : 8,
        tulora: d.tulora ? parseInt(d.tulora) : 0,
        komment: d.komment || ''
      }));
      renderCalendar();
    }
  });
});

const honapNevek = ['', 'Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const muszakNevek = { 1:'DE', 2:'DE', 3:'DU', 4:'ÉJ' };

function renderCalendar() {
  // Placeholder eltávolítása
  const placeholder = document.getElementById('calendarPlaceholder');
  if (placeholder) placeholder.remove();

  const months = [...new Set(data.map(d => d.honap))];
  let html = '';

  months.forEach(month => {
    html += '<div class="month">';
    html += `<h2>${honapNevek[month]}</h2>`;
    html += '<table><tr><th>H</th><th>K</th><th>Sze</th><th>Cs</th><th>P</th><th>Szo</th><th>V</th></tr>';

    const monthData = data.filter(d => d.honap === month);
    let currentWeek = [];

    for (let i = 0; i < monthData.length; i++) {
      const day = monthData[i];
      const classes = [];
      if (day.ledolgozott) classes.push('ledolgozott');
      if (day.szabadsag) classes.push('szabadsag');
      if (day.tappenz) classes.push('tappenz');
      if (day.ledolgozas) classes.push('ledolgozas');
      if (day.piheno) classes.push('piheno');
      if (day.unnep) classes.push('unnep');

      if (day.nap === 1) {
        for (let j = 1; j < day.napIndex; j++) currentWeek.push('<td></td>');
      }

      currentWeek.push(`
        <td class="${classes.join(' ')}" data-index="${data.indexOf(day)}">
          <div style="position: relative;">
            <div style="font-weight:bold;">${day.nap}</div>
            <div class="muszak-display" style="font-size:12px; margin-top:2px;">
  ${muszakNevek[day.muszak1] || day.muszak1}/${muszakNevek[day.muszak2] || day.muszak2}
</div>
            ${day.komment.trim() !== '' ? '<span class="comment-icon">✏️</span>' : ''}
          </div>
        </td>
      `);

      if (day.napIndex === 7 || i === monthData.length - 1) {
        html += '<tr>' + currentWeek.join('') + '</tr>';
        currentWeek = [];
      }
    }

    html += '</table></div>';
  });

  document.getElementById('calendar').innerHTML = html;

  // Jelmagyarázat
  document.getElementById('legend').innerHTML = `
    <h3>🗓️ Jelmagyarázat</h3>
    <div class="legend-item"><span class="color-box unnep"></span> Ünnepnap</div>
    <div class="legend-item"><span class="color-box piheno"></span> Pihenőnap</div>
    <div class="legend-item"><span class="color-box ledolgozas"></span> Ledolgozás</div>
    <div class="legend-item"><span class="color-box szabadsag"></span> Szabadság</div>
    <div class="legend-item"><span class="color-box tappenz"></span> Táppénz</div>
  `;

  const saveBtn = document.getElementById('saveCsvBtn');
  if (saveBtn) {
    saveBtn.style.display = 'inline-block';
    saveBtn.onclick = exportTableToCSV;
  }

  // Év alul
  let detectedYear = new Date().getFullYear();
  if (fileInput.files.length > 0) {
    const match = fileInput.files[0].name.match(/(20\d{2})/);
    if (match) detectedYear = match[1];
  }
  document.getElementById('yearLabel').innerText = detectedYear;

  // Popup események
  document.querySelectorAll('#calendar td').forEach(td => {
    td.addEventListener('click', () => {
      const idx = td.dataset.index;
      if(idx === undefined) return;
      const day = data[idx];

      document.getElementById('popupTitle').innerText = `Nap: ${honapNevek[day.honap]} ${day.nap}.`;
      document.getElementById('editMuszak1').value = day.muszak1;
      document.getElementById('editMuszak2').value = day.muszak2;
      document.getElementById('editSzabadsag').checked = day.szabadsag;
      document.getElementById('editTappenz').checked = day.tappenz;
      document.getElementById('editPiheno').checked = day.piheno;
      document.getElementById('editLedolgozas').checked = day.ledolgozas;
      document.getElementById('editLedolgozott').checked = day.ledolgozott;
      document.getElementById('editLedolgozottOra').value = day.ledolgozottOra;
      document.getElementById('editTulora').value = day.tulora;
      document.getElementById('editComment').value = day.komment;

      document.getElementById('popupOverlay').style.display = 'block';
      document.getElementById('dayEditPopup').style.display = 'block';

      document.getElementById('saveDayEditBtn').onclick = () => {
        day.muszak1 = parseInt(document.getElementById('editMuszak1').value);
        day.muszak2 = parseInt(document.getElementById('editMuszak2').value);
        day.szabadsag = document.getElementById('editSzabadsag').checked;
        day.tappenz = document.getElementById('editTappenz').checked;
        day.piheno = document.getElementById('editPiheno').checked;
        day.ledolgozas = document.getElementById('editLedolgozas').checked;
        day.ledolgozott = document.getElementById('editLedolgozott').checked;
        day.ledolgozottOra = parseInt(document.getElementById('editLedolgozottOra').value);
        day.tulora = parseInt(document.getElementById('editTulora').value);
        day.komment = document.getElementById('editComment').value;

        closePopup();
        renderCalendar();
      };

      document.getElementById('closeDayEditBtn').onclick = closePopup;
      document.getElementById('popupOverlay').onclick = closePopup;

      function closePopup() {
        document.getElementById('popupOverlay').style.display = 'none';
        document.getElementById('dayEditPopup').style.display = 'none';
      }
    });
  });
}

// Mentés CSV-be
function exportTableToCSV() {
  const header = "honap;nap;napIndex;muszak1;muszak2;unnep;piheno;ledolgozas;szabadsag;tappenz;ledolgozott;ledolgozottOra;tulora;komment\n";
  let csv = header;
  data.forEach(d => {
    const kommentEscaped = `"${(d.komment || '').replace(/"/g,'""')}"`;
    csv += `${d.honap};${d.nap};${d.napIndex};${d.muszak1};${d.muszak2};${d.unnep};${d.piheno};${d.ledolgozas};${d.szabadsag};${d.tappenz};${d.ledolgozott};${d.ledolgozottOra};${d.tulora};${kommentEscaped}\n`;
  });

  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');
  const fileName = `naptar_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}.csv`;

  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
