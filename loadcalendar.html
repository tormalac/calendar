<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Naptár CSV alapján</title>
<style>
  body {font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; margin: 20px;}
  
#calendar {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px; /* ez eltolja a hónapokat a gombtól */
  }

  .month {
    flex: 1 1 300px;
    max-width: 500px;
    border: 1px solid #ccc;
    padding: 10px;
    box-sizing: border-box;
  }

  .month table {
    width: 100%;
    border-collapse: collapse;
  }

  .month th, .month td {
    border: 1px solid #333;
    padding: 5px;
    text-align: center;
    width: 14.28%; /* 7 nap = 100% */
  }

  .unnep { background-color: #f88; }
  .piheno { background-color: #ffeb99; }
  .ledolgozas { background-color: #99ccff; }
  .szabadsag { background-color: #99ff99; }
  .tappenz { background-color: #cc99ff; }

  button {
    margin: 10px 0;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 16px;
  }

  /* rejtett file input */
  #csvFile { display: none; }
</style>
</head>
<body>

<h1>Naptár beolvasása</h1>

<div id="fileUploadContainer">
  <button id="selectFileBtn">📂 CSV megnyitása</button>
  <input type="file" id="csvFile" accept=".csv" />
</div>

<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const fileInput = document.getElementById('csvFile');
const selectBtn = document.getElementById('selectFileBtn');

selectBtn.addEventListener('click', () => {
    fileInput.click(); // a gomb megnyomásakor a rejtett input aktiválódik
});

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    Papa.parse(file, {
        header: true,
        delimiter: ';',
        skipEmptyLines: true,
        complete: function(results) {
            renderCalendar(results.data);
        }
    });
});

const honapNevek = ['', 'Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
const muszakNevek = { '1':'DE','2':'DE','3':'DU','4':'ÉJ' };

function renderCalendar(data) {
    const months = [...new Set(data.map(d => d.honap))];
    let html = '';

    months.forEach(month => {
        html += '<div class="month">';
        html += `<h2>${honapNevek[parseInt(month)]}</h2>`;
        html += '<table>';
        html += '<tr><th>H</th><th>K</th><th>Sze</th><th>Cs</th><th>P</th><th>Szo</th><th>V</th></tr>';

        const monthData = data.filter(d => d.honap == month);
        let currentWeek = [];

        for (let i = 0; i < monthData.length; i++) {
            const day = monthData[i];
            const classes = [];
            if (day.unnep === 'true') classes.push('unnep');
            if (day.piheno === 'true') classes.push('piheno');
            if (day.ledolgozas === 'true') classes.push('ledolgozas');
            if (day.szabadsag === 'true') classes.push('szabadsag');
            if (day.tappenz === 'true') classes.push('tappenz');

            const muszak1 = muszakNevek[day.muszak1] || day.muszak1;
            const muszak2 = muszakNevek[day.muszak2] || day.muszak2;

            // Hónap első napja előtt üres cellák
            if (day.nap == 1) {
                for (let j = 1; j < day.napIndex; j++) {
                    currentWeek.push('<td></td>');
                }
            }

            currentWeek.push(`<td class="${classes.join(' ')}">${day.nap}<br>${muszak1}/${muszak2}</td>`);

            // Vasárnap vagy utolsó nap a hónapban
            if (day.napIndex == 7 || i === monthData.length - 1) {
                html += '<tr>' + currentWeek.join('') + '</tr>';
                currentWeek = [];
            }
        }

        html += '</table></div>';
    });

    document.getElementById('calendar').innerHTML = html;
}
</script>

</body>
</html>
