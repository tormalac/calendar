<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Jegyzetek</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}
body {
  display: flex;
  flex-direction: column;
}
#topBar {
  height: 60px; /* fix magasság */
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  position: fixed;
  width: 100%;
  z-index: 1000;
}
#topBar h1 {
  display: inline;
  font-size: 24px;
}
#authBox {
    position: fixed;
    top: 10px;
    right: 40px;
    z-index: 2000;
    font-size: 14px;
}
#authStatusButton {
    background: #fff;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
}
#authDropdown {
    position: absolute;
    top: 40px;
    right: 0;
    width: 220px;
    min-width: 220px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    padding: 10px;

    /* >>> UGRÁST MEGOLDÓ TECHNIKÁK <<< */
    opacity: 0;            /* láthatatlan */
    visibility: hidden;    /* de helye már megvan */
    transform: translateY(-4px);
    transition: opacity 0.15s ease-out, transform 0.15s ease-out;

    overflow: hidden;
    pointer-events: none;  /* ne legyen kattintható csukva */
}
#authDropdown.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto; /* kattintható */
}
#authDropdown input,
#authDropdown button {
    width: 100%;
    box-sizing: border-box; /* <<< ez kell a fix elrendezéshez */
    margin: 4px 0;
    padding: 6px;
    font-size: 14px;
    border-radius: 5px;
}
#authDropdown input {
    border: 1px solid #ccc;
}
#authDropdown button {
    border: none;
    cursor: pointer;
}

#authDropdown button:hover {
    background: #eee;
}
#mainContent {
  display: flex;
  flex: 1;           
  margin-top: 60px;      
  height: calc(100vh - 60px); 
}
#sidebar {
  width: 300px;
  border-right: 1px solid #ccc;
  padding: 10px;
  overflow-y: auto;
}

/*Fájlok*/
#fileList li {
  list-style: none;
  margin: 6px 0;
  padding: 10px 12px;
  background: #f0f0f0;
  border-radius: 2px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s, transform 0.1s;
  user-select: none; /* véletlen kijelölés megakadályozása */
}

#fileList li:hover,
#fileList li:active {
  background: #e0e0ff;
}

/*EditorTools*/
#editorToolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: #fff;
  border-bottom: 1px solid #ccc;
  height: 60px;
  max-width: 100%; 
  overflow-x: auto;     /* vízszintes görgetés engedélyezése */
  white-space: nowrap;  /* gombok egy sorban maradnak */
}

#editorToolbar button,
#editorToolbar input {
  flex: 0 0 auto;      /* ne nyúljanak a szülőhöz */
}
  
::-webkit-scrollbar {
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background-color: rgba(0,0,0,0.2);
  border-radius: 3px;
}

#editorToolbar input {
  padding: 6px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 5px;
  flex: 0 0 auto;
}

#editorToolbar button {
  padding: 6px 12px;
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
  flex: 0 0 auto;
}

#editorToolbar button:hover {
  background: #eee;
}
/* Editor */
#editor {
  flex: 1;
  display: flex;
  flex-direction: column; 
  padding: 10px;
  min-width: 0;
}
#editor textarea {
  flex: 1;                  
  width: 100%;              
  box-sizing: border-box;   
  resize: none;
  margin-bottom: 5px;

  background-color: #fffde7;
  padding: 20px;             
  border: 1px solid #ccc;   
  border-radius: 5px;       
  font-size: 16px;            
  line-height: 1.5;         
  color: #333;         
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}
</style>
</head>
<body>
  <div id="topBar">
 <h1>Jegyzet szerkesztő</h1>
<!-- Bejelentkezés panel -->
   <div id="authBox">
    <div id="authStatusButton">❌ Nincs bejelentkezve</div>
    <div id="authDropdown">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Jelszó">
        <button id="loginBtn">Bejelentkezés</button>
        <button id="registerBtn">Regisztráció</button>
        <button id="logoutBtn" style="display:none;">Kilépés</button>
    </div>
  </div>
  </div>
<!-- Left sidebar -->
  <div id="mainContent">
  <div id="sidebar">
    <h3>📁Firestore jegyzetek</h3>
    <ul id="fileList"></ul>
  </div>
<!-- Editor -->
  <div id="editor">

  <div id="editorToolbar">
    <div id="toolbarHandle" title="Húzd ide!"></div>
    <input type="text" id="fileName" placeholder="Fájl neve">
    <button id="newBtn">📄 Új jegyzet</button>
    <button id="openLocalBtn">📂 Megnyitás gépről</button>
    <button id="saveBtn">💾 Mentés a gépre</button>
    <button id="saveFirestoreBtn">🔥 Mentés Firestore-ba</button>
    <button id="duplicateBtn">📑 Duplikálás</button>
    <button id="deleteBtn">🗑️ Törlés Firestore-ból</button>
  </div>

  <input type="file" id="openLocalFile" accept=".txt" style="display:none;">
  <textarea id="fileContent"></textarea>

  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import { 
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

import { 
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut 
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

// --- Firebase konfiguráció ---
const firebaseConfig = {
  apiKey: "AIzaSyDFK6o6sJnFJImBhkX_ZfQq6fXldLZt7vA",
  authDomain: "calendarformeapp.firebaseapp.com",
  projectId: "calendarformeapp",
  storageBucket: "calendarformeapp.firebasestorage.app",
  messagingSenderId: "421913143205",
  appId: "1:421913143205:web:24dc04f3c768f99356aa4c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const authBox = document.getElementById("authBox");
const fileList = document.getElementById("fileList");
const fileContent = document.getElementById("fileContent");
const fileNameInput = document.getElementById("fileName");
let currentFileId = null;

// --- Auth állapot figyelése ---
const emailInput = document.getElementById('email');
const passInput = document.getElementById('password');
const logoutBtn = document.getElementById('logoutBtn');

document.getElementById('loginBtn').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, emailInput.value, passInput.value); } 
  catch(e){ alert("Hiba: "+e.message); }
};
document.getElementById('registerBtn').onclick = async () => {
  try { await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value); alert("✅ Regisztráció sikeres"); } 
  catch(e){ alert("Hiba: "+e.message); }
};
logoutBtn.onclick = async () => { await signOut(auth); };

const authStatusButton = document.getElementById("authStatusButton");
const authDropdown = document.getElementById("authDropdown");

// --- Dropdown nyitása/csukása ---
authStatusButton.onclick = () => {
    authDropdown.classList.toggle("open");
};

document.addEventListener("click", (e) => {
    if (!authBox.contains(e.target)) {
        authDropdown.classList.remove("open");
    }
});

onAuthStateChanged(auth, user => {
    if (user) {
        authStatusButton.textContent = "👤 " + user.email;
        logoutBtn.style.display = "block";

        loadFiles(); // csak ha be van jelentkezve
    } else {
        authStatusButton.textContent = "❌ Nincs bejelentkezve";
        logoutBtn.style.display = "none";

        fileList.innerHTML = "";  // sidebar törlése
        fileContent.value = "";    // editor törlése
    }
});

// Fájlok mentése Store-ba
saveFirestoreBtn.onclick = async () => {
  const newName = fileNameInput.value.trim();
  if (!newName) { 
    alert("Adj meg egy fájlnevet!"); 
    return; 
  }

  if (!auth.currentUser) {
    alert("Előbb jelentkezz be!");
    return;
  }

  try {
    // Új fájl mentése
    await setDoc(doc(db, "files", newName), {
      content: fileContent.value,
      owner: auth.currentUser.email
    });

    // Ha a név változott → töröljük a régi fájlt
    if (currentFileId && currentFileId !== newName) {
      await deleteDoc(doc(db, "files", currentFileId));
    }

    currentFileId = newName; 
    alert("Mentve!");
    loadFiles();

  } catch (e) {
    alert("Hiba a mentésnél: " + e.message);
  }
};

// Fájlok listázása
async function loadFiles() {
  fileList.innerHTML = "";  // lista ürítése
  if (!auth.currentUser) return;

  const q = query(
    collection(db, "files"),
    where("owner", "==", auth.currentUser.email)
  );

  const querySnapshot = await getDocs(q);

  querySnapshot.forEach(docSnap => {
    const li = document.createElement("li");
    li.textContent = docSnap.id;
    li.style.cursor = "pointer";

    // kattintás a fájl megnyitásához
    li.onclick = () => openFile(docSnap.id);

    fileList.appendChild(li);
  });
}

// Fájl megynyitása Store-ból
async function openFile(fileId) {
  currentFileId = fileId;
  fileNameInput.value = fileId;   // << név beállítása

  const docSnap = await getDoc(doc(db, "files", fileId));
  if (docSnap.exists()) {
    fileContent.value = docSnap.data().content || "";
  } else {
    alert("A fájl nem található Firestore-ban!");
  }
}

// Mentés a gépre
document.getElementById("saveBtn").onclick = () => {
  const text = fileContent.value.trim();

  // Ha a tartalom üres → figyelmeztetés
  if (text === "") {
    alert("⚠️ A jegyzet üres, nem lehet menteni!");
    return;
  }

  const name = fileNameInput.value.trim() || "uj_jegyzet";

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
};

// Új jegyzet
const newBtn = document.getElementById("newBtn");

newBtn.onclick = () => {
  currentFileId = null;       // nincs megnyitott fájl
  fileNameInput.value = "";   // fájlnév törlése
  fileContent.value = "";     // tartalom törlése

  fileContent.focus();        // kurzor a szövegmezőbe
};

// Megnyitás gépről
const openLocalBtn = document.getElementById("openLocalBtn");
const openLocalFile = document.getElementById("openLocalFile");

openLocalBtn.onclick = () => {
  openLocalFile.click();  // rejtett fájlkezelő megnyitása
};

openLocalFile.onchange = () => {
  const file = openLocalFile.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    fileContent.value = reader.result; // szöveg beírása
    const plainName = file.name.replace(/\.[^/.]+$/, ""); // levágjuk a .txt-t
    fileNameInput.value = plainName;   // fájlnév beírása
    currentFileId = null;              // ne írja felül a firestore fájlokat
  };

  reader.readAsText(file, "UTF-8");
};

// Fájl duplikálása
duplicateBtn.onclick = async () => {
  if (!currentFileId) {
    alert("Előbb nyiss meg egy jegyzetet!");
    return;
  }

  const originalDocRef = doc(db, "files", currentFileId);
  const originalDoc = await getDoc(originalDocRef);
  if (!originalDoc.exists()) {
    alert("A fájl nem található!");
    return;
  }

  let newName = currentFileId + "_másolat";
  let i = 1;

  // Ellenőrizzük létezést gyorsabban
  const allFilesSnapshot = await getDocs(query(collection(db, "files"), where("owner", "==", auth.currentUser.email)));
  const existingNames = new Set(allFilesSnapshot.docs.map(d => d.id));

  while (existingNames.has(newName)) {
    newName = currentFileId + `_másolat${i}`;
    i++;
  }

  try {
    await setDoc(doc(db, "files", newName), {
      content: originalDoc.data().content,
      owner: auth.currentUser.email
    });

    currentFileId = newName;         // mostantól az új jegyzet aktív
    fileNameInput.value = newName;   // fájlnév frissítése az inputban
    alert(`Jegyzet duplikálva: ${newName}`);
    loadFiles();                     // lista frissítése
  } catch (err) {
    alert("Hiba a duplikálásnál: " + err.message);
  }
};
 
// Fájl törlése Store-ból
const deleteBtn = document.getElementById("deleteBtn");

deleteBtn.onclick = async () => {
  if (!currentFileId) {
    alert("Nincs megnyitott fájl!");
    return;
  }

  if (!auth.currentUser) {
    alert("Előbb jelentkezz be!");
    return;
  }

  const confirmed = confirm(`Biztosan törlöd ezt a fájlt?\n\n${currentFileId}`);
  if (!confirmed) return;

  try {
    await deleteDoc(doc(db, "files", currentFileId));
    
    alert("🗑️ Fájl törölve!");

    // törlés után ürítjük a mezőket
    currentFileId = null;
    fileNameInput.value = "";
    fileContent.value = "";

    loadFiles(); // frissítés
  } 
  catch (e) {
    alert("Hiba törlés közben: " + e.message);
  }
};

    loadFiles();
  </script>
</body>
</html>
