<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Zenelejátszó</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
<link rel="stylesheet" href="styles.css" />

</head>
<body>

<div id="topBar">
<h1>Zenelejátszó</h1>
<div id="authBox">
  <div id="authStatusButton">❌ Nincs bejelentkezve</div>
  <div id="authDropdown">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Jelszó">
    <button id="loginBtn">Bejelentkezés</button>
    <button id="registerBtn">Regisztráció</button>
    <button id="logoutBtn" style="display:none;">Kilépés</button>
  </div>
</div>
</div>

<div id="mainContentMusic">
  

  <div id="topZone">
      <div id="musicToolbar">
         <div class="top">
            <input type="text" id="fileName" placeholder="Zene címe">
            <select id="albumSelect" class="album-select">
               <option disabled selected>Album választása</option>
            </select>
            <button id="newAlbumBtn" class="icon-btn" title="Új album létrehozása">
               <span class="material-icons">library_add</span>
            </button>
            <button id="openLocalBtn" class="icon-btn" title="Helyi fájl megnyitása">
               <span class="material-icons">folder_open</span>
            </button>
            <button id="saveBtn" class="icon-btn" title="Mentés a gépre">
               <span class="material-icons">save</span>
            </button>
            <button id="saveFirestoreBtn" class="icon-btn" title="Mentés Firestore-ba / Cloudinary-be">
               <span class="material-icons">cloud_upload</span>
            </button>
            <button id="deleteBtn" class="icon-btn danger" title="Törlés">
               <span class="material-icons">delete_forever</span>
            </button>
         </div>
         <div class="player-box">
            <audio id="player" controls></audio>
         </div>
         <div id="uploadProgressContainer" style="display:none; margin-top:10px; width:100%; background:#ccc; border-radius:8px;">
         <div id="uploadProgress" style="width:0%; height:12px; background:#4caf50; border-radius:8px;"></div>
      </div>
      </div>
      <input type="file" id="fileInput" accept="audio/*" style="display:none;">
   </div>

   <div id="midZone">

   <div id="albumSort">Albumok rendezése:
      <select id="albumSortSelect">
        <option value="abc">ABC</option>
        <option value="time">időrend</option>
      </select>
     </div>
     <div id="albumsContainer"></div>
   </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp,
  getDocs,
  query,
  where,
  orderBy,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFK6o6sJnFJImBhkX_ZfQq6fXldLZt7vA",
  authDomain: "calendarformeapp.firebaseapp.com",
  projectId: "calendarformeapp",
  storageBucket: "calendarformeapp.firebasestorage.app",
  messagingSenderId: "421913143205",
  appId: "1:421913143205:web:24dc04f3c768f99356aa4c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const authStatusButton = document.getElementById("authStatusButton");
const authDropdown = document.getElementById("authDropdown");
const emailInput = document.getElementById("email");
const passInput = document.getElementById("password");
const logoutBtn = document.getElementById("logoutBtn");

authStatusButton.onclick = () => authDropdown.classList.toggle("open");
document.addEventListener("click", e => { if(!authDropdown.contains(e.target) && e.target!==authStatusButton) authDropdown.classList.remove("open"); });

document.getElementById('loginBtn').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, emailInput.value, passInput.value); }
  catch(e){ alert("Hiba: "+e.message); }
};
document.getElementById('registerBtn').onclick = async () => {
  try { await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value); alert("✅ Regisztráció sikeres"); }
  catch(e){ alert("Hiba: "+e.message); }
};
logoutBtn.onclick = async () => { await signOut(auth); };

onAuthStateChanged(auth, user => {
  if(user){
    authStatusButton.textContent = "👤 "+user.email;
    logoutBtn.style.display = "block";
    renderSongs();
  } else {
    authStatusButton.textContent = "❌ Nincs bejelentkezve";
    logoutBtn.style.display = "none";
    document.getElementById("albumsContainer").innerHTML = "";
  }
});

// Globális változók
const openBtn = document.getElementById('openLocalBtn');
const fileInput = document.getElementById('fileInput');
const player = document.getElementById('player');
const fileNameInput = document.getElementById('fileName');
let selectedFile = null;          // A helyi fájl, amit épp kiválasztott a felhasználó
let selectedFileDocId = null;     // Firestore dokumentum ID-ja a kiválasztott zenének
let selectedFilePublicId = null;  // Cloudinary public_id-ja a kiválasztott zenének
let currentSongId = null;
let openAlbums = new Set();
let albumSortMode = {};
let lastPlayButton = null;
let playlist = [];
let currentIndex = 0;

// Play gomb
player.onplay = () => {
    if (lastPlayButton) {
        lastPlayButton.innerHTML = '<span class="material-icons">pause</span>';
    }
    updatePlayingHighlight();
};

player.onpause = () => {
    if (lastPlayButton) {
        lastPlayButton.innerHTML = '<span class="material-icons">play_arrow</span>';
    }
};

/*player.onended = () => {
    if (lastPlayButton) {
        lastPlayButton.innerHTML = '<span class="material-icons">play_arrow</span>';
    }
    updatePlayingHighlight();
};*/

player.onended = () => {
    if (currentIndex + 1 < playlist.length) {
        currentIndex++;
        const nextSong = playlist[currentIndex];
        player.src = nextSong.url;
        player.play();
        currentSongId = nextSong.id;
        selectedFileDocId = nextSong.id;
        selectedFilePublicId = nextSong.public_id;
        fileNameInput.value = nextSong.name;

        // Play gomb frissítése
        if (lastPlayButton) lastPlayButton.innerHTML = '<span class="material-icons">play_arrow</span>';
        const nextBtn = document.querySelector(`.song[data-id="${nextSong.id}"] .playBtn`);
        if (nextBtn) {
            nextBtn.innerHTML = '<span class="material-icons">pause</span>';
            lastPlayButton = nextBtn;
        }

    } else {
        // ha az album véget ért
        currentSongId = null;
        lastPlayButton = null;
        updatePlayingHighlight();
    }
};

// Kijelölés
/*function updatePlayingHighlight() {
    document.querySelectorAll(".song").forEach(div => {
        if (div.dataset.id === currentSongId) {
            div.classList.add("playing");
        } else {
            div.classList.remove("playing");
        }
    });
}*/

function updatePlayingHighlight() {
    document.querySelectorAll(".song").forEach(div => {
        const playBtn = div.querySelector(".playBtn span");
        if (div.dataset.id === currentSongId) {
            div.classList.add("playing");
            if (player.paused) {
                playBtn.textContent = "play_arrow";
            } else {
                playBtn.textContent = "pause";
            }
        } else {
            div.classList.remove("playing");
            playBtn.textContent = "play_arrow";
        }
    });
}

// Zenék lekérdezése album szerint
async function fetchSongs() {
    if (!auth.currentUser) return []; // Ha nincs bejelentkezett user, üres tömb

    const songsCol = collection(db, "songs");

    // Egyszerű lekérdezés: csak a bejelentkezett user zenéi
    const q = query(songsCol, where("owner", "==", auth.currentUser.uid));

    const snapshot = await getDocs(q);
    const songs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    return songs;
}

// Album kiválasztása
function updateAlbumSelect(songs) {
    const select = document.getElementById('albumSelect');
    const albums = Array.from(new Set(songs.map(s => s.album || "Alap Album")));
    select.innerHTML = `<option disabled selected>Album választása</option>` +
        albums.map(a => `<option value="${a}">${a}</option>`).join('');
}

// Új album
document.getElementById('newAlbumBtn').onclick = () => {
    const newAlbum = prompt("Új album neve:");
    if(!newAlbum) return;
    const select = document.getElementById('albumSelect');
    const option = document.createElement('option');
    option.value = newAlbum;
    option.textContent = newAlbum;
    select.appendChild(option);
    select.value = newAlbum;
};

// Fájlok kirajzolása

async function renderSongs() {
    const songs = await fetchSongs();
    const container = document.getElementById("albumsContainer");
    container.innerHTML = "";

    if (songs.length === 0) {
        container.innerHTML = "<p>Nincs még feltöltött zene.</p>";
        return;
    }

    // Album csoportosítás
    const albums = {};
    songs.forEach(song => {
        const albumName = song.album || "Alap Album";
        if (!albums[albumName]) albums[albumName] = [];
        albums[albumName].push(song);
    });

    // --- ALBUM RENDEZÉS ---
    const sortAlbumsBy = document.getElementById("albumSortSelect")?.value || "abc";

    const allAlbumNames = Object.keys(albums);

    // ABC rendezés
    if (sortAlbumsBy === "abc") {
        allAlbumNames.sort((a, b) => a.localeCompare(b));
    }

    // IDŐREND RENDEZÉS → az album utolsó feltöltött dalának ideje
    if (sortAlbumsBy === "time") {
        allAlbumNames.sort((a, b) => {
           const lastA = Math.max(...albums[a].map(s => s.uploadedAt?.seconds || 0));
           const lastB = Math.max(...albums[b].map(s => s.uploadedAt?.seconds || 0));
           return lastB - lastA;
        });
    }

    for (const albumName of allAlbumNames) {

        // --- Alapértelmezett rendezés beállítása
        if (!albumSortMode[albumName]) albumSortMode[albumName] = 'time';


        const albumDiv = document.createElement("div");
        albumDiv.className = "album";

        if (openAlbums.has(albumName)) albumDiv.classList.add("open");

        // --- Album fejléc
        const header = document.createElement("div");
        header.className = "album-header";

        header.innerHTML = `
    <span class="album-title">
        <span class="folder-icon material-symbols-rounded">folder</span>
        <span class="album-name" contenteditable="true" spellcheck="false">${albumName}</span>
    </span>
    <span class="right-controls">
        Dalok rendezése: 
        <select class="sortSelect">
            <option value="time" ${albumSortMode[albumName]==='time' ? 'selected' : ''}>Időrend</option>
            <option value="abc" ${albumSortMode[albumName]==='abc' ? 'selected' : ''}>ABC</option>
        </select>
        <span class="arrow">
          <span class="material-symbols-rounded">
          ${openAlbums.has(albumName) ? "expand_less" : "expand_more"}
          </span>
        </span>
    </span>
`;
    // Album szerkesztése
    const nameSpan = header.querySelector(".album-name");

nameSpan.addEventListener("click", e => {
    e.stopPropagation(); // ne csukja be az albumot
});

nameSpan.addEventListener("blur", async () => {
    const newName = nameSpan.textContent.trim();
    if (!newName) {
        nameSpan.textContent = albumName;
        return;
    }
    if (newName === albumName) return;

    const oldName = albumName;
    const songsToUpdate = albums[oldName];

    // dalok album mező átírása
    for (const song of songsToUpdate) {
        await updateDoc(doc(db, "songs", song.id), { album: newName });
    }

    // állapot átmozgatása
    openAlbums.delete(oldName);
    openAlbums.add(newName);

    albumSortMode[newName] = albumSortMode[oldName];
    delete albumSortMode[oldName];

    renderSongs();
});

    // Album nyit/csuk toggle
    header.addEventListener("click", (e) => {
    // Ha a kattintás a selectre esett, ne csináljon semmit
    if (e.target.tagName === 'SELECT') return;

    albumDiv.classList.toggle("open");

    const arrowIcon = header.querySelector(".arrow .material-symbols-rounded");
    arrowIcon.textContent = albumDiv.classList.contains("open")
    ? "expand_less"
    : "expand_more";

    if (albumDiv.classList.contains("open")) openAlbums.add(albumName);
    else openAlbums.delete(albumName);
});

// Rendezés select esemény (csak a rendezést változtatja, nem nyit/csuk)
header.querySelector(".sortSelect").addEventListener("change", (e) => {
    albumSortMode[albumName] = e.target.value;

    // Megőrizni az album nyitott állapotát, hogy ne tűnjön el
    renderSongs();
});

        // --- Tartalom
        const content = document.createElement("div");
        content.className = "album-content";

        // Rendezés albumon belül
        let songsInAlbum = [...albums[albumName]];
        if (albumSortMode[albumName] === 'abc') {
            songsInAlbum.sort((a, b) => a.name.localeCompare(b.name));
        } else {
            songsInAlbum.sort((a, b) => (b.uploadedAt?.seconds || 0) - (a.uploadedAt?.seconds || 0));
        }

        songsInAlbum.forEach(song => {
            const songDiv = document.createElement("div");
            songDiv.className = "song";

            songDiv.dataset.id = song.id;

            if (currentSongId === song.id) songDiv.classList.add("playing");

            songDiv.innerHTML = `
                <button class="playBtn"><span class="material-icons">play_arrow</span></button>
                <div class="song-info" contenteditable="true" spellcheck="false" data-ms-editor="false">${song.name}</div>
                <div class="song-actions">
                    <select>
                        ${allAlbumNames.map(a => `<option value="${a}" ${a === song.album ? 'selected' : ''}>${a}</option>`).join('')}
                    </select>
                    <button class="deleteBtn"><span class="material-icons">delete</span></button>
                </div>
            `;

            songDiv.addEventListener("click", e => e.stopPropagation());

            //Play pause gomb
            const playBtn = songDiv.querySelector(".playBtn");

playBtn.onclick = (e) => {
    e.stopPropagation();

    // Ha másik dal van kiválasztva, új playlist építése
    if (currentSongId !== song.id) {
        const albumName = song.album || "Alap Album";
        // playlist: az összes dal ebben az albumban
        playlist = songsInAlbum = [...albums[albumName]];
        // rendezzük a playlistet az albumSortMode szerint
        if (albumSortMode[albumName] === 'abc') {
            playlist.sort((a, b) => a.name.localeCompare(b.name));
        } else {
            playlist.sort((a, b) => (b.uploadedAt?.seconds || 0) - (a.uploadedAt?.seconds || 0));
        }

        currentIndex = playlist.findIndex(s => s.id === song.id);
        currentSongId = song.id;
        selectedFileDocId = song.id;
        selectedFilePublicId = song.public_id;
        fileNameInput.value = song.name;
        player.src = song.url;
        player.play();
        lastPlayButton = playBtn;
    } else {
        // ugyanaz a dal → toggle play/pause
        if (player.paused) player.play();
        else player.pause();
    }

    updatePlayingHighlight();
};


            // Albumváltás
            const albumSelect = songDiv.querySelector("select");
            albumSelect.onchange = async (e) => {
                e.stopPropagation();
                await updateDoc(doc(db, "songs", song.id), { album: e.target.value });
                renderSongs();
            };

            // Lejátszás
            /*songDiv.querySelector(".playBtn").onclick = (e) => {
                e.stopPropagation();
                player.src = song.url;
                player.play();
                currentSongId = song.id;
                selectedFileDocId = song.id;
                selectedFilePublicId = song.public_id;
                fileNameInput.value = song.name;
                renderSongs();
            };*/

            // Átnevezés
            songDiv.querySelector(".song-info").addEventListener("blur", async (e) => {
                const newName = e.target.textContent.trim();
                if (!newName) { e.target.textContent = song.name; return; }
                if (newName !== song.name) {
                    await updateDoc(doc(db, "songs", song.id), { name: newName });
                    song.name = newName;
                    if (selectedFileDocId === song.id) fileNameInput.value = newName;
                }
            });

            // Törlés
            songDiv.querySelector(".deleteBtn").onclick = async (e) => {
                e.stopPropagation();
                if (!confirm(`Biztos törlöd: ${song.name}?`)) return;
                if (song.public_id) {
                    await fetch(`https://music-backend-jq1s.onrender.com/delete/${song.public_id}`, { method: "DELETE" });
                }
                await deleteDoc(doc(db, "songs", song.id));
                if (player.src === song.url) player.src = "";
                renderSongs();
            };

            content.appendChild(songDiv);
        });

        albumDiv.appendChild(header);
        albumDiv.appendChild(content);
        container.appendChild(albumDiv);
    }

    updateAlbumSelect(songs);
}

// Fájl kiválasztás
openBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
    selectedFile = e.target.files[0];

    selectedFileDocId = null;
    selectedFilePublicId = null;
    currentSongId = null;

    if(selectedFile){
        player.src = URL.createObjectURL(selectedFile);
        player.play();
        if(!fileNameInput.value) fileNameInput.value = selectedFile.name.replace('.mp3','');
    }
});

// Mentés gépre

document.getElementById('saveBtn').addEventListener('click', () => {

    // 1) Van helyi fájl → azt mentsük
    if (selectedFile) {
        let name = fileNameInput.value.trim() || selectedFile.name;
        if (!name.endsWith('.mp3')) name += '.mp3';

        const link = document.createElement('a');
        link.href = URL.createObjectURL(selectedFile);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return;
    }

    // 2) Ha nincs helyi fájl, de Firestore-ból játszunk → URL letöltése
    if (player.src && selectedFileDocId) {
        const fileName = fileNameInput.value.trim() || "zene.mp3";

        const link = document.createElement('a');
        link.href = player.src;   // Cloudinary közvetlen URL
        link.download = fileName.endsWith('.mp3') ? fileName : fileName + ".mp3";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return;
    }

    alert("Nincs mit menteni!");
});

// Segédfüggvény a progress kezelésére
function uploadFileWithProgress(file, onProgress) {
    return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append('file', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://music-backend-jq1s.onrender.com/upload');

        // progress esemény
        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                onProgress(percent);
            }
        });

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                resolve(JSON.parse(xhr.responseText));
            } else {
                reject(xhr.responseText);
            }
        };
        xhr.onerror = () => reject(xhr.responseText);

        xhr.send(formData);
    });
}

// Mentés Firestore + Cloudinary progressel

document.getElementById('saveFirestoreBtn').addEventListener('click', async () => {
    if(!selectedFile){ alert("Először válassz ki egy zenét!"); return; }
    if(!auth.currentUser){ alert("Be kell jelentkezned a mentéshez!"); return; }

    let name = fileNameInput.value.trim() || selectedFile.name.replace('.mp3','');
    let albumName = document.getElementById('albumSelect').value || "Alap Album";

    const formData = new FormData();
    formData.append('file', selectedFile);

    // Progress bar elemek
    const progressContainer = document.getElementById('uploadProgressContainer');
    const progressBar = document.getElementById('uploadProgress');
    progressBar.style.width = "0%";
    progressContainer.style.display = "block";

    try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', "https://music-backend-jq1s.onrender.com/upload");

        // Progress esemény
        xhr.upload.onprogress = (e) => {
            if(e.lengthComputable){
                // Lokális feltöltés max 90%-ig
                let percent = Math.floor((e.loaded / e.total) * 90);
                progressBar.style.width = percent + "%";
            }
        };

        xhr.onload = async () => {
            if(xhr.status !== 200){
                console.error('Upload hiba:', xhr.responseText);
                alert('Hiba a feltöltés során!');
                progressContainer.style.display = "none";
                return;
            }

            // Cloudinary kész, 100%-ra ugrik
            progressBar.style.width = "100%";

            const data = JSON.parse(xhr.responseText);

            // Firestore mentés
            const docRef = await addDoc(collection(db, "songs"), {
                name: name,
                url: data.url,
                public_id: data.public_id,
                album: albumName,
                uploadedAt: serverTimestamp(),
                owner: auth.currentUser.uid
            });

            selectedFileDocId = docRef.id;
            selectedFilePublicId = data.public_id;

            alert("Sikeresen feltöltve és mentve!");

            renderSongs();

            // Progress bar eltűntetése 2 másodperc múlva
            setTimeout(() => { progressContainer.style.display = "none"; }, 2000);
        };

        xhr.send(formData);

    } catch(err){
        console.error(err);
        alert("Hiba a feltöltés során!");
        progressContainer.style.display = "none";
    }
});

// Törlés Firestore + Cloudinary
document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!selectedFileDocId || !selectedFilePublicId) {
        alert("Nincs kiválasztva fájl!");
        return;
    }

    try {
        // 1) Cloudinary törlés
        await fetch(`https://music-backend-jq1s.onrender.com/delete/${selectedFilePublicId}`, {
            method: 'DELETE'
        });

        // 2) Firestore törlés
        await deleteDoc(doc(db, "songs", selectedFileDocId));

        alert("Fájl törölve!");

        // UI reset
        player.src = "";
        fileNameInput.value = "";
        selectedFile = null;
        selectedFileDocId = null;
        selectedFilePublicId = null;

    } catch (err) {
        console.error(err);
        alert("Hiba a törlés során!");
    }

    renderSongs();
});

// Album rendezés
document.getElementById("albumSortSelect").addEventListener("change", () => {
    renderSongs();
});

</script>
</body>
</html>
