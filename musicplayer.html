<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Zenelejátszó</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
html, body { height: 100%; margin: 0; font-family: sans-serif; }
body { display: flex; flex-direction: column; }
#topBar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); position: fixed; width: 100%; z-index: 1000; }
#topBar h1 { font-size: 24px; }
#authBox { position: fixed; top: 10px; right: 40px; z-index: 2000; font-size: 14px; }
#authStatusButton { background: #fff; padding: 6px 12px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
#authDropdown { position: absolute; top: 40px; right: 0; width: 220px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 10px; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: 0.15s; pointer-events: none; }
#authDropdown.open { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
#authDropdown input, #authDropdown button { width: 100%; margin: 4px 0; padding: 6px; border-radius: 5px; box-sizing: border-box; }
#authDropdown input { border: 1px solid #ccc; }
#authDropdown button { border: none; cursor: pointer; }
#authDropdown button:hover { background: #eee; }
#mainContent {
    display: flex;
    flex-direction: column;
    margin-top: 60px;
    height: calc(100vh - 60px);
    padding: 10px;
    gap: 20px;
}
#musicToolbar {
    min-width: 500px;                    /* ← ízlés szerint */
    flex-shrink: 0;                  /* ne húzódjon össze */
    background: #1e1e1e;
    padding: 15px;
    border-radius: 16px;
    color: white;
    height: fit-content;             /* csak akkora legyen, amennyi kell */
    position: sticky;
    top: 80px;                       /* scroll közben is marad felül */
}

#musicToolbar .top { display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow-x: auto; padding-bottom: 4px; }
#musicToolbar input, .album-select { flex: 1; min-width: 120px; padding: 8px 10px; background: #333; border: 1px solid #444; border-radius: 8px; color: white; }
.album-select { max-width: 200px; }
.icon-btn { padding: 8px 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; cursor: pointer; font-size: 18px; transition: 0.2s; }
.icon-btn:hover { background: #3d3d3d; }
.icon-btn.danger { background: #5a1e1e; border-color: #7a2b2b; }
.icon-btn.danger:hover { background: #7a2b2b; }
.player-box { background: #2b2b2b; padding: 10px; border-radius: 12px; }
#player { width: 100%; height: 36px; filter: invert(85%) hue-rotate(180deg); }
.album {
    margin-bottom: 12px;
    border-radius: 8px;
    background: #f2f2f2;
    overflow: hidden;
}

.album-header {
    padding: 12px 16px;
    background: #e0e0e0;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    user-select: none;
}

.album-header:hover {
    background: #d6d6d6;
}

.album-content {
    display: none; /* alapból csukva */
    padding: 10px 16px;
    border-top: 1px solid #ccc;
}
.album.open .album-content {
    display: block;
}

.album h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 1.2rem;
    color: #222;
}

.album-title {
    border-bottom: 1px solid transparent;
    padding: 2px 4px;
}

.album-title:focus {
    outline: none;
    border-color: #999;
}

.right-controls {
    display: flex;
    align-items: center;
    gap: 5px; /* kis távolság a szöveg és a select között */
    font-size: 0.85rem;
    font-weight: normal; 
}

.right-controls select {
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid #ccc;
    background-color: #fff;
    cursor: pointer;
}

.song {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin: 6px 0;
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 4px;
    transition: background 0.2s;
}

.song.playing {
    background-color: #cce7ff; 
    transition: background-color 0.3s;
    color: #003366;
}

.song .song-info {
    flex: 1 1 auto; /* növekedhet, de alap 200px */
    margin-left: 0;                   /* bal margó nullázva */
    max-width: calc(100% - 260px); 
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-info[contenteditable="true"] {
    border-bottom: 1px solid transparent; /* dashed → solid */
    cursor: text;
    transition: border-color 0.2s;
}

.song-info[contenteditable="true"]:focus {
    outline: none;
    border-color: #999;
}

.song .song-actions {
    display: flex;
    gap: 8px;
    min-width: 250px; /* hogy a gombok elférjenek */
    justify-content: flex-end;
}

.song select {
    background: #f0f0f0;
    border: 1px solid #ccc;
    color: #222;
    border-radius: 4px;
    padding: 4px 6px;
    cursor: pointer;
}

/*.song button {
    padding: 6px 10px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background: #eee;
    color: #222;
    transition: 0.2s;
}
.song button:hover {
    background: #ddd;
}*/

.song button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #eaeaea;
    cursor: pointer;
    transition: 0.2s;
}

.song button:hover {
    background: #d5d5d5;
}

.material-icons {
    font-size: 20px;
    color: #333;
}

.song button.danger {
    background: #fdd;
    border-color: #faa;
}
.song button.danger:hover {
    background: #fbb;
}
.song button.playBtn {
    font-size: 18px;
    padding: 6px 10px;
}

/* Lejátszóban album select design */
#musicToolbar select#albumSelect {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: white;
    min-width: 140px;
}

#albumSort {
    display: inline;
    font-size: 14px;
}

#albumSortSelect {
    height: 24px !important;
    max-width: 160px !important;
    padding: 0 6px !important;
    margin-left: 4px;
    font-size: 14px;
    background: #fff;
    color: #222;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box !important;
    font-weight: normal;
}

#albumsContainer {
    flex: 1;               /* tölti a jobb oldalt */
    padding-right: 10px;
    overflow-y: auto;      /* scrollozható album lista */
}

</style>
</head>
<body>

<div id="topBar">
<h1>Zenelejátszó</h1>
<div id="authBox">
  <div id="authStatusButton">❌ Nincs bejelentkezve</div>
  <div id="authDropdown">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Jelszó">
    <button id="loginBtn">Bejelentkezés</button>
    <button id="registerBtn">Regisztráció</button>
    <button id="logoutBtn" style="display:none;">Kilépés</button>
  </div>
</div>
</div>

<div id="mainContent">
  
  <div id="musicToolbar">
    <div class="top">
    <input type="text" id="fileName" placeholder="Zene címe">
    <select id="albumSelect" class="album-select">
        <option disabled selected>Album választása</option>
    </select>
    <button id="newAlbumBtn" class="icon-btn">➕</button>
    <button id="openLocalBtn" class="icon-btn">📂</button>
    <button id="saveBtn" class="icon-btn">💾</button>
    <button id="saveFirestoreBtn" class="icon-btn">🌥️</button>
    <button id="deleteBtn" class="icon-btn danger">🗑️</button>
    </div>
    <div class="player-box">
        <audio id="player" controls></audio>
    </div>
  </div>

   <div id="uploadProgressContainer" style="display:none; margin-top:10px; width:100%; background:#ccc; border-radius:8px;">
    <div id="uploadProgress" style="width:0%; height:12px; background:#4caf50; border-radius:8px;"></div>
   </div>

  <input type="file" id="fileInput" accept="audio/*" style="display:none;">

  <div id="albumSort">Albumok rendezése:
    <select id="albumSortSelect">
      <option value="abc">ABC</option>
      <option value="time">időrend</option>
    </select>
  </div>
  <div id="albumsContainer"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  serverTimestamp,
  getDocs,
  query,
  where,
  orderBy,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFK6o6sJnFJImBhkX_ZfQq6fXldLZt7vA",
  authDomain: "calendarformeapp.firebaseapp.com",
  projectId: "calendarformeapp",
  storageBucket: "calendarformeapp.firebasestorage.app",
  messagingSenderId: "421913143205",
  appId: "1:421913143205:web:24dc04f3c768f99356aa4c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const authStatusButton = document.getElementById("authStatusButton");
const authDropdown = document.getElementById("authDropdown");
const emailInput = document.getElementById("email");
const passInput = document.getElementById("password");
const logoutBtn = document.getElementById("logoutBtn");

authStatusButton.onclick = () => authDropdown.classList.toggle("open");
document.addEventListener("click", e => { if(!authDropdown.contains(e.target) && e.target!==authStatusButton) authDropdown.classList.remove("open"); });

document.getElementById('loginBtn').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, emailInput.value, passInput.value); }
  catch(e){ alert("Hiba: "+e.message); }
};
document.getElementById('registerBtn').onclick = async () => {
  try { await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value); alert("✅ Regisztráció sikeres"); }
  catch(e){ alert("Hiba: "+e.message); }
};
logoutBtn.onclick = async () => { await signOut(auth); };

onAuthStateChanged(auth, user => {
  if(user){
    authStatusButton.textContent = "👤 "+user.email;
    logoutBtn.style.display = "block";
    renderSongs();
  } else {
    authStatusButton.textContent = "❌ Nincs bejelentkezve";
    logoutBtn.style.display = "none";
    document.getElementById("albumsContainer").innerHTML = "";
  }
});

// Globális változók
const openBtn = document.getElementById('openLocalBtn');
const fileInput = document.getElementById('fileInput');
const player = document.getElementById('player');
const fileNameInput = document.getElementById('fileName');
let selectedFile = null;          // A helyi fájl, amit épp kiválasztott a felhasználó
let selectedFileDocId = null;     // Firestore dokumentum ID-ja a kiválasztott zenének
let selectedFilePublicId = null;  // Cloudinary public_id-ja a kiválasztott zenének
let currentSongId = null;
let openAlbums = new Set();
let albumSortMode = {};
let lastPlayButton = null;

// Play gomb
player.onplay = () => {
    if (lastPlayButton) {
        lastPlayButton.innerHTML = '<span class="material-icons">pause</span>';
    }
    updatePlayingHighlight();
};

player.onpause = () => {
    if (lastPlayButton) {
        lastPlayButton.innerHTML = '<span class="material-icons">play_arrow</span>';
    }
};

player.onended = () => {
    if (lastPlayButton) {
        lastPlayButton.innerHTML = '<span class="material-icons">play_arrow</span>';
    }
    updatePlayingHighlight();
};

// Kijelölés
function updatePlayingHighlight() {
    document.querySelectorAll(".song").forEach(songDiv => {
        const playBtn = songDiv.querySelector(".playBtn");
        const id = songDiv.dataset.id;

        if (id === currentSongId) {
            songDiv.classList.add("playing");
            playBtn.innerHTML = player.paused 
                ? '<span class="material-icons">play_arrow</span>' 
                : '<span class="material-icons">pause</span>';
        } else {
            songDiv.classList.remove("playing");
            playBtn.innerHTML = '<span class="material-icons">play_arrow</span>';
        }
    });
}

// Zenék lekérdezése album szerint
async function fetchSongs() {
    if (!auth.currentUser) return []; // Ha nincs bejelentkezett user, üres tömb

    const songsCol = collection(db, "songs");

    // Egyszerű lekérdezés: csak a bejelentkezett user zenéi
    const q = query(songsCol, where("owner", "==", auth.currentUser.uid));

    const snapshot = await getDocs(q);
    const songs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    return songs;
}

// Album kiválasztása
function updateAlbumSelect(songs) {
    const select = document.getElementById('albumSelect');
    const albums = Array.from(new Set(songs.map(s => s.album || "Alap Album")));
    select.innerHTML = `<option disabled selected>Album választása</option>` +
        albums.map(a => `<option value="${a}">${a}</option>`).join('');
}

// Új album
document.getElementById('newAlbumBtn').onclick = () => {
    const newAlbum = prompt("Új album neve:");
    if(!newAlbum) return;
    const select = document.getElementById('albumSelect');
    const option = document.createElement('option');
    option.value = newAlbum;
    option.textContent = newAlbum;
    select.appendChild(option);
    select.value = newAlbum;
};

// Fájlok kirajzolása

async function renderSongs() {
    const songs = await fetchSongs();
    const container = document.getElementById("albumsContainer");
    container.innerHTML = "";

    if (songs.length === 0) {
        container.innerHTML = "<p>Nincs még feltöltött zene.</p>";
        return;
    }

    // Album csoportosítás
    const albums = {};
    songs.forEach(song => {
        const albumName = song.album || "Alap Album";
        if (!albums[albumName]) albums[albumName] = [];
        albums[albumName].push(song);
    });

    // --- ALBUM RENDEZÉS ---
    const sortAlbumsBy = document.getElementById("albumSortSelect")?.value || "abc";

    const allAlbumNames = Object.keys(albums);

    // ABC rendezés
    if (sortAlbumsBy === "abc") {
        allAlbumNames.sort((a, b) => a.localeCompare(b));
    }

    // IDŐREND RENDEZÉS → az album utolsó feltöltött dalának ideje
    if (sortAlbumsBy === "time") {
        allAlbumNames.sort((a, b) => {
           const lastA = Math.max(...albums[a].map(s => s.uploadedAt?.seconds || 0));
           const lastB = Math.max(...albums[b].map(s => s.uploadedAt?.seconds || 0));
           return lastB - lastA;
        });
    }

    for (const albumName of allAlbumNames) {

        // --- Alapértelmezett rendezés beállítása
        if (!albumSortMode[albumName]) albumSortMode[albumName] = 'time';


        const albumDiv = document.createElement("div");
        albumDiv.className = "album";

        if (openAlbums.has(albumName)) albumDiv.classList.add("open");

        // --- Album fejléc
        const header = document.createElement("div");
        header.className = "album-header";

        header.innerHTML = `
    <span class="album-title" contenteditable="true" spellcheck="false">
    📁 ${albumName}
    </span>
    <span class="right-controls">
        Dalok rendezése: 
        <select class="sortSelect">
            <option value="time" ${albumSortMode[albumName]==='time' ? 'selected' : ''}>Időrend</option>
            <option value="abc" ${albumSortMode[albumName]==='abc' ? 'selected' : ''}>ABC</option>
        </select>
        <span class="arrow">${openAlbums.has(albumName) ? "▲" : "▼"}</span>
    </span>
`;
    // Album szerkesztése
    const titleSpan = header.querySelector(".album-title");

titleSpan.addEventListener("click", e => {
    // Ne csukja be az albumot
    e.stopPropagation();
});

titleSpan.addEventListener("blur", async () => {
    let newName = titleSpan.textContent.replace("📁", "").trim();
    if (!newName) {
        titleSpan.textContent = "📁 " + albumName;
        return;
    }
    if (newName === albumName) return;

    // Firestore: minden dal album mezőjének átírása
    const oldName = albumName;

    const songsToUpdate = albums[oldName]; // ezek tartoznak az albumba

    for (const song of songsToUpdate) {
        await updateDoc(doc(db, "songs", song.id), {
            album: newName
        });
    }

    // Frissítés UI-ra
    openAlbums.delete(oldName);
    openAlbums.add(newName);

    // A rendezési módot is át kell tenni az új névre
    albumSortMode[newName] = albumSortMode[oldName];
    delete albumSortMode[oldName];

    renderSongs();
});


    // Album nyit/csuk toggle
    header.addEventListener("click", (e) => {
    // Ha a kattintás a selectre esett, ne csináljon semmit
    if (e.target.tagName === 'SELECT') return;

    albumDiv.classList.toggle("open");
    const arrow = header.querySelector(".arrow");
    arrow.textContent = albumDiv.classList.contains("open") ? "▲" : "▼";
    if (albumDiv.classList.contains("open")) openAlbums.add(albumName);
    else openAlbums.delete(albumName);
});

// Rendezés select esemény (csak a rendezést változtatja, nem nyit/csuk)
header.querySelector(".sortSelect").addEventListener("change", (e) => {
    albumSortMode[albumName] = e.target.value;

    // Megőrizni az album nyitott állapotát, hogy ne tűnjön el
    renderSongs();
});

        // --- Tartalom
        const content = document.createElement("div");
        content.className = "album-content";

        // Rendezés albumon belül
        let songsInAlbum = [...albums[albumName]];
        if (albumSortMode[albumName] === 'abc') {
            songsInAlbum.sort((a, b) => a.name.localeCompare(b.name));
        } else {
            songsInAlbum.sort((a, b) => (b.uploadedAt?.seconds || 0) - (a.uploadedAt?.seconds || 0));
        }

        songsInAlbum.forEach(song => {
            const songDiv = document.createElement("div");
            songDiv.className = "song";

            songDiv.dataset.id = song.id;

            if (currentSongId === song.id) songDiv.classList.add("playing");

            songDiv.innerHTML = `
                <button class="playBtn"><span class="material-icons">play_arrow</span></button>
                <div class="song-info" contenteditable="true" spellcheck="false" data-ms-editor="false">${song.name}</div>
                <div class="song-actions">
                    <select>
                        ${allAlbumNames.map(a => `<option value="${a}" ${a === song.album ? 'selected' : ''}>${a}</option>`).join('')}
                    </select>
                    <button class="deleteBtn"><span class="material-icons">delete</span></button>
                </div>
            `;

            songDiv.addEventListener("click", e => e.stopPropagation());

            //Play pause gomb
            const playBtn = songDiv.querySelector(".playBtn");

            playBtn.onclick = (e) => {
                e.stopPropagation();
// Ha másik gombot nyomtunk meg → visszaállítjuk a régi play ikont
    if (lastPlayButton && lastPlayButton !== playBtn) {
        lastPlayButton.innerHTML = '<span class="material-icons">play_arrow</span>';
    }

    // Ha ugyanazt a zenét nyomjuk
    if (player.src === song.url) {
        if (player.paused) {
            player.play();  // folytatás ott, ahol abbahagytuk
        } else {
            player.pause(); // szünet
        }
    } else {
        player.src = song.url;  // új zene → újraindítás
        player.play();
    }

    // beállítjuk az új "aktív" play gombot
                
                lastPlayButton = playBtn;
                currentSongId = song.id;
                selectedFileDocId = song.id;
                selectedFilePublicId = song.public_id;
                fileNameInput.value = song.name;

                updatePlayingHighlight();
                //renderSongs();
            };


            // Albumváltás
            const albumSelect = songDiv.querySelector("select");
            albumSelect.onchange = async (e) => {
                e.stopPropagation();
                await updateDoc(doc(db, "songs", song.id), { album: e.target.value });
                renderSongs();
            };

            // Lejátszás
            /*songDiv.querySelector(".playBtn").onclick = (e) => {
                e.stopPropagation();
                player.src = song.url;
                player.play();
                currentSongId = song.id;
                selectedFileDocId = song.id;
                selectedFilePublicId = song.public_id;
                fileNameInput.value = song.name;
                renderSongs();
            };*/

            // Átnevezés
            songDiv.querySelector(".song-info").addEventListener("blur", async (e) => {
                const newName = e.target.textContent.trim();
                if (!newName) { e.target.textContent = song.name; return; }
                if (newName !== song.name) {
                    await updateDoc(doc(db, "songs", song.id), { name: newName });
                    song.name = newName;
                    if (selectedFileDocId === song.id) fileNameInput.value = newName;
                }
            });

            // Törlés
            songDiv.querySelector(".deleteBtn").onclick = async (e) => {
                e.stopPropagation();
                if (!confirm(`Biztos törlöd: ${song.name}?`)) return;
                if (song.public_id) {
                    await fetch(`https://music-backend-jq1s.onrender.com/delete/${song.public_id}`, { method: "DELETE" });
                }
                await deleteDoc(doc(db, "songs", song.id));
                if (player.src === song.url) player.src = "";
                renderSongs();
            };

            content.appendChild(songDiv);
        });

        albumDiv.appendChild(header);
        albumDiv.appendChild(content);
        container.appendChild(albumDiv);
    }

    updateAlbumSelect(songs);
}

// ----- PLAYER ESEMÉNYEK -----
player.onplay = updatePlayingHighlight;
player.onpause = updatePlayingHighlight;
player.onended = () => {
    currentSongId = null;
    updatePlayingHighlight();
};

// Fájl kiválasztás
openBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
    selectedFile = e.target.files[0];

    selectedFileDocId = null;
    selectedFilePublicId = null;
    currentSongId = null;

    if(selectedFile){
        player.src = URL.createObjectURL(selectedFile);
        player.play();
        if(!fileNameInput.value) fileNameInput.value = selectedFile.name.replace('.mp3','');
    }
});

// Mentés gépre

document.getElementById('saveBtn').addEventListener('click', () => {

    // 1) Van helyi fájl → azt mentsük
    if (selectedFile) {
        let name = fileNameInput.value.trim() || selectedFile.name;
        if (!name.endsWith('.mp3')) name += '.mp3';

        const link = document.createElement('a');
        link.href = URL.createObjectURL(selectedFile);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return;
    }

    // 2) Ha nincs helyi fájl, de Firestore-ból játszunk → URL letöltése
    if (player.src && selectedFileDocId) {
        const fileName = fileNameInput.value.trim() || "zene.mp3";

        const link = document.createElement('a');
        link.href = player.src;   // Cloudinary közvetlen URL
        link.download = fileName.endsWith('.mp3') ? fileName : fileName + ".mp3";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return;
    }

    alert("Nincs mit menteni!");
});

// Segédfüggvény a progress kezelésére
function uploadFileWithProgress(file, onProgress) {
    return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append('file', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://music-backend-jq1s.onrender.com/upload');

        // progress esemény
        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                onProgress(percent);
            }
        });

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                resolve(JSON.parse(xhr.responseText));
            } else {
                reject(xhr.responseText);
            }
        };
        xhr.onerror = () => reject(xhr.responseText);

        xhr.send(formData);
    });
}

// Mentés Firestore + Cloudinary progressel

document.getElementById('saveFirestoreBtn').addEventListener('click', async () => {
    if(!selectedFile){ alert("Először válassz ki egy zenét!"); return; }
    if(!auth.currentUser){ alert("Be kell jelentkezned a mentéshez!"); return; }

    let name = fileNameInput.value.trim() || selectedFile.name.replace('.mp3','');
    let albumName = document.getElementById('albumSelect').value || "Alap Album";

    const formData = new FormData();
    formData.append('file', selectedFile);

    // Progress bar elemek
    const progressContainer = document.getElementById('uploadProgressContainer');
    const progressBar = document.getElementById('uploadProgress');
    progressBar.style.width = "0%";
    progressContainer.style.display = "block";

    try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', "https://music-backend-jq1s.onrender.com/upload");

        // Progress esemény
        xhr.upload.onprogress = (e) => {
            if(e.lengthComputable){
                // Lokális feltöltés max 90%-ig
                let percent = Math.floor((e.loaded / e.total) * 90);
                progressBar.style.width = percent + "%";
            }
        };

        xhr.onload = async () => {
            if(xhr.status !== 200){
                console.error('Upload hiba:', xhr.responseText);
                alert('Hiba a feltöltés során!');
                progressContainer.style.display = "none";
                return;
            }

            // Cloudinary kész, 100%-ra ugrik
            progressBar.style.width = "100%";

            const data = JSON.parse(xhr.responseText);

            // Firestore mentés
            const docRef = await addDoc(collection(db, "songs"), {
                name: name,
                url: data.url,
                public_id: data.public_id,
                album: albumName,
                uploadedAt: serverTimestamp(),
                owner: auth.currentUser.uid
            });

            selectedFileDocId = docRef.id;
            selectedFilePublicId = data.public_id;

            alert("Sikeresen feltöltve és mentve!");

            renderSongs();

            // Progress bar eltűntetése 2 másodperc múlva
            setTimeout(() => { progressContainer.style.display = "none"; }, 2000);
        };

        xhr.send(formData);

    } catch(err){
        console.error(err);
        alert("Hiba a feltöltés során!");
        progressContainer.style.display = "none";
    }
});

// Törlés Firestore + Cloudinary
document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!selectedFileDocId || !selectedFilePublicId) {
        alert("Nincs kiválasztva fájl!");
        return;
    }

    try {
        // 1) Cloudinary törlés
        await fetch(`https://music-backend-jq1s.onrender.com/delete/${selectedFilePublicId}`, {
            method: 'DELETE'
        });

        // 2) Firestore törlés
        await deleteDoc(doc(db, "songs", selectedFileDocId));

        alert("Fájl törölve!");

        // UI reset
        player.src = "";
        fileNameInput.value = "";
        selectedFile = null;
        selectedFileDocId = null;
        selectedFilePublicId = null;

    } catch (err) {
        console.error(err);
        alert("Hiba a törlés során!");
    }

    renderSongs();
});

// Album rendezés
document.getElementById("albumSortSelect").addEventListener("change", () => {
    renderSongs();
});
