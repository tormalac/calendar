<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Kezdőlap</title>
  <style>
    /* Alap stílus */
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0078d7, #66a6ff);
      color: #333;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Központi kártya */
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      padding: 40px 50px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cím */
    h1 {
      color: #0078d7;
      font-size: 22px;
      margin-bottom: 25px;
    }

    /* Gombok */
    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background-color: #0078d7;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background-color: #005fa3;
      transform: scale(1.02);
    }

    /* Lábléc */
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Üdvözöllek a munkaidő naptáradban</h1>

    <button onclick="window.location.href='newcalendar.html'">📅 Új munkaidő naptár létrehozása</button>
    <button onclick="window.location.href='loadcalendar.html'">✏️ Munkaidő naptár szerkesztése</button>
    <button onclick="window.location.href='budget.html'">💰 Bérkalkulátor</button>

    <footer>© 2025 Munkaidő Kalkulátor</footer>
  </div>

</body>
</html>
