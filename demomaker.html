// audio engedélyezése
let audioEnabled = false;
let availableInputs = [];
let availableOutputs = [];

async function enableAudio() {
  if (audioEnabled) return;

  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    console.error('Audio permission denied or error:', err);
    alert('Audio engedély szükséges a működéshez.\nHiba: ' + err.message);
    throw err; // újradobjuk, hogy a hívó is kezelje
  }

  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    availableInputs = devices.filter(d => d.kind === 'audioinput');
    availableOutputs = devices.filter(d => d.kind === 'audiooutput');

    audioEnabled = true;
    console.log('Audio enabled');
    console.log('Available inputs:', availableInputs);
    console.log('Available outputs:', availableOutputs);

  } catch (err) {
    console.error('Error enumerating devices:', err);
    alert('Nem sikerült lekérni az audio eszközöket.\nHiba: ' + err.message);
    throw err;
  }
}

const enableAudioBtn = document.getElementById('enableAudioBtn');

enableAudioBtn.onclick = async () => {
  try {
    await enableAudio();

    document.querySelectorAll('.track-container').forEach(track => {
      populateAudioSources(track);
      populateOutputDevices(track);
    });

    enableAudioBtn.textContent = 'Audio Ready';
    enableAudioBtn.disabled = true;

  } catch (err) {
    console.warn('Audio nem aktiválható:', err);
    enableAudioBtn.textContent = 'Enable Audio';
    enableAudioBtn.disabled = false;

};

// Stream Monitoring

list.addEventListener('click', async e => {
  const btn = e.target.closest('.monitor-btn');
  if (!btn) return;

  btn.classList.toggle('active');

  const track = btn.closest('.track-container');
  const name = track.querySelector('.track-name').textContent;

  const inputBtn = track.querySelector('.audio-source-picker button.selected');
  const outputBtn = track.querySelector('.output-picker button.selected');

  if (!inputBtn) {
    alert("Válassz előbb bemenetet!");
    btn.classList.remove('active');
    return;
  }

  const inputId = inputBtn.dataset.deviceId;
  const outputId = outputBtn?.dataset.outputId;

  let stream = trackStreams.get(track);

  if (!stream && inputId !== 'virtual') {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: inputId } });
      trackStreams.set(track, stream);
    } catch (err) {
      console.error('Cannot get input stream:', err);
      alert('Hiba a mikrofon elérésénél: ' + err.message);
      btn.classList.remove('active');
      return;
    }
  }

  let audioEl = track.querySelector('audio');
  if (!audioEl) {
    audioEl = document.createElement('audio');
    audioEl.autoplay = true;
    track.appendChild(audioEl);
  }

  if (btn.classList.contains('active')) {
    audioEl.srcObject = inputId === 'virtual' ? null : stream;
    audioEl.muted = false;
    if (outputId && outputId !== 'virtual') {
      audioEl.setSinkId(outputId).catch(err => console.warn('Cannot set output', err));
    }
    console.log('Direct monitoring ON:', name);
  } else {
    audioEl.srcObject = null;
    console.log('Direct monitoring OFF:', name);
  }
});

//sliderek értéke látszódjon
document.addEventListener('input', e => {
  if (e.target.matches('.track-sliders input[type="range"]')) {
    const valueSpan = e.target.nextElementSibling;
    if (valueSpan) {
      // Ha Volume, mutass % jelet, ha Pan, csak szám
      if (e.target.parentElement.textContent.includes('Vol')) {
        valueSpan.textContent = e.target.value + '%';
      } else {
        valueSpan.textContent = e.target.value;

});

// Audió források nyilvánossátétele
// Bemenet dropdown feltöltése
function populateAudioSources(track) {
  const inputPicker = track.querySelector('.audio-source-picker');
  inputPicker.innerHTML = '';

  if (!audioEnabled) {
    const btn = document.createElement('button');
    btn.textContent = 'Enable Audio first';
    btn.disabled = true;
    inputPicker.appendChild(btn);
    return;
  }

  availableInputs.forEach(input => {
    const btn = document.createElement('button');
    btn.textContent = input.label || 'Audio Input';
    btn.dataset.deviceId = input.deviceId;
    inputPicker.appendChild(btn);
  });

  const virtualBtn = document.createElement('button');
  virtualBtn.textContent = 'Virtual';
  virtualBtn.dataset.deviceId = 'virtual';
  inputPicker.appendChild(virtualBtn);
}

// Kimenet dropdown feltöltése
function populateOutputDevices(track) {
  const outputPicker1 = track.querySelector('.output-picker');
  outputPicker1.innerHTML = '';

  if (!audioEnabled) {
    const btn = document.createElement('button');
    btn.textContent = 'Enable Audio first';
    btn.disabled = true;
    outputPicker1.appendChild(btn);
    return;
  }

  availableOutputs.forEach(device => {
    const btn = document.createElement('button');
    btn.textContent = device.label || 'Unknown Output';
    btn.dataset.outputId = device.deviceId;
    outputPicker1.appendChild(btn);
  });
}

document.addEventListener('click', e => {
  const track = e.target.closest('.track-container');

  if (!track) {
    document.querySelectorAll('.audio-source-picker, .output-picker')
            .forEach(p => p.style.display = 'none');
    return;
  }

  const sourceSpan = track.querySelector('.audio-source');
  const sourcePicker = track.querySelector('.audio-source-picker');

  const outputSpan = track.querySelector('.output');
  const outputPicker = track.querySelector('.output-picker');

  // Input span → nyit/zár
  if (e.target === sourceSpan) {
    sourcePicker.style.display = sourcePicker.style.display === 'flex' ? 'none' : 'flex';
    outputPicker.style.display = 'none';
    return;
  }

  // Output span → nyit/zár
  if (e.target === outputSpan) {
    outputPicker.style.display = outputPicker.style.display === 'flex' ? 'none' : 'flex';
    sourcePicker.style.display = 'none';
    return;
  }

  // Input gomb kiválasztás
  if (e.target.closest('.audio-source-picker')) {
    const btn = e.target.closest('button');
    if (!btn) return;

    sourceSpan.textContent = btn.textContent;
    sourcePicker.style.display = 'none';

    console.log('Input selected:', btn.textContent);
    return;
  }

  // Output gomb kiválasztás
  if (e.target.closest('.output-picker')) {
    const btn = e.target.closest('button');
    if (!btn) return;

    outputSpan.textContent = btn.textContent;
    outputPicker.style.display = 'none';

    // Audio elemhez kimenet beállítása
    const audioEl = track.querySelector('audio');
    if (audioEl && btn.dataset.outputId) {
      if (btn.dataset.outputId !== 'virtual') {
        audioEl.setSinkId(btn.dataset.outputId)
          .then(() => console.log('Output set to', btn.textContent))
          .catch(err => console.error('Cannot set output', err));
      }
    }

    return;
  }
});

// Lejátszó
let playheadX = 200;

const playhead = document.getElementById("playhead");

function updatePlayhead(x) {
  playheadX = x;
  playhead.style.left = x + "px";
}

const timelineScroll = document.getElementById("timelineScroll");

function updatePlayheadFromEvent(e) {
  const scroll = document.getElementById('timelineScroll');
  const rect = scroll.getBoundingClientRect();

  const x =
    e.clientX
    - rect.left
    + scroll.scrollLeft;

  updatePlayhead(x);
}

function isTimelineEvent(e) {
  return e.target.closest('.track-area');
}

document.addEventListener("pointerdown", e => {
  if (!isTimelineEvent(e)) return;
  updatePlayheadFromEvent(e);
});

document.addEventListener("pointermove", e => {
  if (e.buttons !== 1) return;
  if (!isTimelineEvent(e)) return;
  updatePlayheadFromEvent(e);
});

// időkezelés
let PX_PER_SECOND = 100;

function timeToX(time) {
  return time * PX_PER_SECOND;
}

function xToTime(x) {
  return x / PX_PER_SECOND;
}

function updatePlayheadFromTime(time) {
  updatePlayhead(timeToX(time));
}

//zoom
let zoom = 1;

function updateScale() {
  PX_PER_SECOND = 100 * zoom;
}

//scroll playhead együtt
list.addEventListener('scroll', e => {
  if (!e.target.classList.contains('track-area')) return;

  playhead.style.transform =
    `translateX(${-e.target.scrollLeft}px)`;
}, true);
